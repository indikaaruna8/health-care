services:
  # Laravel Application Service
  app:
    build:
      context: .
      dockerfile: ./configs/php/Dockerfile
    image: laravel-app
    container_name: laravel-app
    volumes:
      - ./src:/var/www/html
    networks:
      - laravel_network  # Define the network here

  nginx:
    build:
      context: .
      dockerfile: ./configs/nginx/Dockerfile
    image: nginx-laravel
    container_name: laravel-nginx
    #volumes:
    #  - ./configs/nginx/laravel.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8088:80"  # Map port 8088 on host to port 80 in the Nginx container
    depends_on:
      - app  # Ensure Nginx starts after the Laravel app container
    networks:
      - laravel_network  # Reference the same network here

  # Database Service (MySQL)
  db:
    image: mysql:9.6.0
    container_name: laravel-db
    environment:
      MYSQL_DATABASE: helthcare
      MYSQL_ROOT_PASSWORD: helthcarepwd
    ports:
      - "33306:3306"  # Map port 33306 on host to port 3306 in the container
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - laravel_network  # Reference the same network here

  # Node.js Service
  node:
    build:
      context: .
      dockerfile: ./configs/node/Dockerfile
    image: laravel-node
    container_name: laravel-node   
    volumes:
      - ./src:/var/www/html
      - /var/www/html/node_modules
    networks:
      - laravel_network
    environment:
      - VITE_PORT=5173
      - VITE_HOST=0.0.0.0
    ports:
      - "5173:5173"  

networks:
  laravel_network:
    driver: bridge
